name: CI

on:
  push:
    branches: [main, "v*/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # Pinned on purpose: a new ruff can add rules or change the format, which
  # would turn the build red with no change in the repo. Bump it deliberately,
  # together with ruff.toml if needed.
  RUFF_VERSION: "0.16.10"
  PYTEST_VERSION: "9.1.1"

jobs:
  # Windows is where wcm is used every day (PowerShell 5.1), so it is
  # first-class. macOS and Linux keep the core portable. A change is not done
  # if its tests only run on one OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install tools
        run: python -m pip install "ruff==${{ env.RUFF_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format
        run: python -m ruff format --check .

      # relcheck runs before the project is installed, so it is tested apart.
      - name: test relcheck
        run: python -m pytest tools

      # The product steps start once the change that scaffolds the package
      # lands pyproject.toml; until then there is nothing to install or test.
      - name: install
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install -e ".[dev]"

      - name: test
        if: hashFiles('pyproject.toml') != ''
        run: python -m pytest

  # Builds exactly what a release publishes: the version stamped by relcheck,
  # then the sdist and the wheel. The job keeps its name: it is a required
  # check on main.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: build
        if: hashFiles('pyproject.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build twine
          python tools/relcheck.py stamp --version v0.0.0-alpha.1
          python -m build
          python -m twine check --strict dist/*
          ls dist/*-0.0.0a1-*.whl dist/*-0.0.0a1.tar.gz
