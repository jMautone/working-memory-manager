name: Release

# Publishes the version a squash commit on main declares at the end of its
# title, "<title> [vX.Y.Z] (#N)". Commits without a version publish nothing.
# Conventions: docs/decisions/0001-versionado-y-releases.md.

on:
  push:
    branches: [main]
  # Dry run: builds the release files for the chosen ref without tagging or
  # publishing. GitHub only offers it once this file is on main.
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"

# No concurrency group on purpose: GitHub keeps one pending run per group and
# cancels the older one, which would silently drop a release. Each run tags
# and publishes its own commit, so runs for different commits are independent.

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: relcheck reads main's titles for the version
      # and for the notes of an alpha.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install build
        run: python -m pip install build

      - name: dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python -m build
          (cd dist && sha256sum -- * > checksums.txt && cat checksums.txt)

      - name: version
        id: version
        if: github.event_name == 'push'
        run: |
          version="$(python tools/relcheck.py merge --rev HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishes: ${version:-nothing}"

      # Tag and publish in one job: a tag pushed with GITHUB_TOKEN does not
      # trigger other workflows. Re-running after a failure is safe: the tag is
      # created only if missing, and an existing Release gets its files and
      # notes replaced.
      - name: tag and publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$(git log -1 --format=%s HEAD)"
            git push origin "refs/tags/$VERSION"
          fi

          # The source keeps a placeholder version; the release stamps the
          # one the title declares, the way a binary gets it injected.
          python tools/relcheck.py stamp --version "$VERSION"
          python -m build
          (cd dist && sha256sum -- * > checksums.txt)

          # An alpha gets the titles merged since the previous version; a
          # final gets its CHANGELOG.md section and becomes latest.
          python tools/relcheck.py notes --version "$VERSION" --rev HEAD > "$RUNNER_TEMP/notes.md"
          case "$VERSION" in
            *-alpha.*) flags=(--prerelease --latest=false) ;;
            *) flags=(--latest) ;;
          esac

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
