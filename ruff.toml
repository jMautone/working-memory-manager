# Lint and format rules for the whole repository: the product and tools/.
# CI runs `ruff check` and `ruff format --check` with the version pinned in
# .github/workflows/ci.yml.
target-version = "py314"
line-length = 100
src = ["src", "tools"]
# Python only: code blocks in Markdown (plan, specs, skills) are prose.
extend-exclude = ["*.md"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
